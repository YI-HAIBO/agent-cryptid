#         cmake --build build -j && sudo cmake --install build
#     then link your benchmark against liboqs.a (+ -lcrypto -lpthread -lm).
#   * Alternative Python bindings (NOT required for the paper numbers):
dilithium-py==1.5.1       # ML-DSA reference (pure-Python KAT cross-check)
