# =============================================================================
# agent-cryptid — exact dependency lock (reproducibility)
#
# TIER 0 (CORE): NO mandatory third-party dependency.
#   The entire proto/ package runs on Python 3.9+ stdlib only:
#       python proto/entrypoint.py --check
#   This is the headline reproducibility claim: the cryptographic core
#   (SM2/SM3/SM9, credential, delegation, revocation, auth, persistence)
#   is self-contained and needs no `pip install` at all.
#
# TIER A (Eval framework, research/eval_framework.py): OPTIONAL, graceful
#   degradation if absent (both are wrapped in try/except in the source).
matplotlib==3.11.2        # figures (HAVE_MPL); absent => no figures, results still valid
# psutil==6.0.0           # hardware info in system_info(); absent => "n/a" (fine)

# TIER B (E10 A2A/MCP integration): REQUIRES a dedicated venv (NOT this one).
#   The main eval framework imports these lazily only for E10. Create a
#   separate env so the core env stays dependency-free:
#       python -m venv envs/a2amcp && envs/a2amcp/bin/pip install \
#           a2a-sdk==1.2.3 mcp==2.3.0 mcp-types==2.3.0
#   a2a-sdk==1.2.3
#   mcp==2.3.0
#   mcp-types==2.3.0

# TIER C1 (Optional SM2/SM3 acceleration, proto/sm2_fast.py): OPTIONAL.
#   Core sm2.py has a pure-Python fallback; sm2_fast uses gmssl when present.
gmssl==3.2.2

# TIER C2 (Optional Redis nonce store, proto/nonce_store.py): OPTIONAL.
