<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#33415c"/>
    </marker>
    <linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#33415c"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="lg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="lg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Agent-Cryptid Four-Layer Architecture</text>

  <!-- Layer 1: Identification -->
  <rect x="40" y="55" width="740" height="90" rx="8" fill="url(#lg1)" opacity="0.9"/>
  <text x="60" y="80" font-size="14" font-weight="bold" fill="#f8fafc">Layer 1: Identification</text>
  <text x="60" y="100" font-size="11" fill="#cbd5e1">agent://&lt;org&gt;/&lt;id&gt; &nbsp;|&nbsp; tenant-scoped identity record</text>
  <text x="60" y="118" font-size="11" fill="#cbd5e1">Public keys: SM2 &nbsp; ML-DSA-65 &nbsp; SLH-DSA &nbsp;|&nbsp; Private keys derived locally</text>
  <text x="60" y="136" font-size="10" fill="#94a3b8">Hardware-rooted key derivation (v3.0 roadmap)</text>

  <!-- Arrow 1→2 -->
  <line x1="410" y1="145" x2="410" y2="165" stroke="#33415c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Credentialing (3-tier) -->
  <rect x="40" y="170" width="740" height="130" rx="8" fill="url(#lg2)" opacity="0.9"/>
  <text x="60" y="195" font-size="14" font-weight="bold" fill="#f8fafc">Layer 2: Credentialing — Three-Tier Cryptographic Agility</text>

  <!-- Tier boxes inside Layer 2 -->
  <rect x="60" y="210" width="200" height="40" rx="5" fill="#1e40af" opacity="0.7"/>
  <text x="160" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">SM2 Tier (GB/T 32918)</text>

  <rect x="280" y="210" width="220" height="40" rx="5" fill="#6d28d9" opacity="0.7"/>
  <text x="390" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Hybrid Tier: SM2 ∧ ML-DSA-65 (fail-closed)</text>

  <rect x="520" y="210" width="200" height="40" rx="5" fill="#047857" opacity="0.7"/>
  <text x="620" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">SLH-DSA Tier (FIPS 205)</text>

  <text x="60" y="270" font-size="10" fill="#dbeafe">Fields: iss · sub · act · origin · aud · scope · iat/nbf/exp · alg_tier · nonce · sig_s · pq_sig</text>
  <text x="60" y="288" font-size="10" fill="#dbeafe">Fail-closed: both SM2 and ML-DSA must verify · alg_tier covered by signature · aud bound</text>

  <!-- Arrow 2→3 -->
  <line x1="410" y1="300" x2="410" y2="320" stroke="#33415c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Delegation -->
  <rect x="40" y="325" width="740" height="80" rx="8" fill="url(#lg3)" opacity="0.9"/>
  <text x="60" y="350" font-size="14" font-weight="bold" fill="#f8fafc">Layer 3: Delegation</text>
  <text x="60" y="370" font-size="11" fill="#cbd5e1">Chainable authority delegation · scope convergence (child ⊆ parent)</text>
  <text x="60" y="388" font-size="11" fill="#cbd5e1">Each hop signed with delegator identity key · audience consistency · origin tracking (confusion-attack prevention)</text>

  <!-- Arrow 3→4 -->
  <line x1="410" y1="405" x2="410" y2="425" stroke="#33415c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: Notarization -->
  <rect x="40" y="430" width="740" height="80" rx="8" fill="url(#lg4)" opacity="0.9"/>
  <text x="60" y="455" font-size="14" font-weight="bold" fill="#f8fafc">Layer 4: Notarization</text>
  <text x="60" y="475" font-size="11" fill="#cbd5e1">Revocation: Merkle accumulator with offline proofs · JTI blacklist</text>
  <text x="60" y="493" font-size="11" fill="#cbd5e1">Audit: hash-ledger chaining (v3.0: on-chain anchoring)</text>

  <!-- Security properties callout -->
  <rect x="40" y="515" width="740" height="25" rx="5" fill="#f1f5f9" opacity="0.8"/>
  <text x="410" y="532" text-anchor="middle" font-size="9" fill="#475569">Security: ProVerif 2.05 (6/6 proved, 0.29s) · EUF-CMA reduction min(Adv_SM2, Adv_MLDSA)=2^-128 · 14/14 attacks rejected · KAT 50/50</text>
</svg>